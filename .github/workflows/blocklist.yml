name: Build Blacklist Release
on:
  schedule:
    - cron: "1 */6 * * *"
  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch blacklist
        env:
          API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: |
          curl -G https://api.abuseipdb.com/api/v2/blacklist?ipVersion=4 \
            -d confidenceMinimum=95 \
            -d limit=10000 \
            -H "Key: $API_KEY" \
            -H "Accept: text/plain" \
            -o blacklist.txt
          if ! grep -qE '([0-9]{1,3}\.){3}[0-9]{1,3}' blacklist.txt; then
            echo "Error: No IPs fetched. Possibly reached API usage limit."
            exit 1
          fi

      - name: Delete existing release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_IDS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/releases \
            | jq -r '.[].id')

          for ID in $RELEASE_IDS; do
            TAG=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$ID \
              | jq -r '.tag_name')

            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$ID

            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG
          done

      - name: Set release date
        run: echo "RELEASE_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_ENV

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "blacklist-latest"
          name: "Blacklist ${{ env.RELEASE_DATE }}"
          files: blacklist.txt
